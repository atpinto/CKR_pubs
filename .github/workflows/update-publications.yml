name: Update publications from PubMed

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      seed_database:
        description: "Import publications.csv without querying PubMed (first run only)"
        required: false
        type: boolean
        default: false
      skip_citations:
        description: "Skip the Scopus citation refresh for this run"
        required: false
        type: boolean
        default: false
      social_dry_run:
        description: "Write the social media posts and show them in the log, but schedule nothing"
        required: false
        type: boolean
        default: false
      preview_posts_since:
        description: "Preview only: skip the PubMed update and show posts for publications added since this date (e.g. 2026-09-28); nothing is scheduled"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publication-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update database and CSV backup
        if: ${{ !inputs.preview_posts_since }}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          SCOPUS_MAX_LOOKUPS: ${{ vars.SCOPUS_MAX_LOOKUPS }}
        run: |
          if [ "${{ inputs.seed_database }}" = "true" ]; then
            python scripts/sync_database.py --csv publications.csv --seed
          elif [ "${{ inputs.skip_citations }}" = "true" ]; then
            python scripts/sync_database.py --csv publications.csv --no-citations
          else
            python scripts/sync_database.py --csv publications.csv
          fi

      - name: Commit updated CSV
        if: ${{ !inputs.preview_posts_since }}
        run: |
          if git diff --quiet -- publications.csv; then
            echo "No publication changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.csv
          git commit -m "Update publications from PubMed ($(date -u +%F))"
          git push

      - name: Schedule social media posts for new publications
        if: ${{ !inputs.seed_database }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_IDS: ${{ vars.BUFFER_CHANNEL_IDS }}
          SOCIAL_POSTS_SINCE: ${{ inputs.preview_posts_since || vars.SOCIAL_POSTS_SINCE }}
        run: |
          if [ -z "$BUFFER_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SOCIAL_POSTS_SINCE" ]; then
            echo "LinkedIn posting is not set up (see README section 6); skipping."
            exit 0
          fi
          pip install --quiet anthropic
          if [ "${{ inputs.social_dry_run }}" = "true" ] || [ -n "${{ inputs.preview_posts_since }}" ]; then
            python scripts/social_posts.py --dry-run
          else
            python scripts/social_posts.py
          fi
