name: Update publications from PubMed

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:
    inputs:
      seed_database:
        description: "Import publications.csv without querying PubMed (first run only)"
        required: false
        type: boolean
        default: false
      skip_citations:
        description: "Skip the Google Scholar citation refresh for this run"
        required: false
        type: boolean
        default: false
      citation_max_lookups:
        description: "Google Scholar lookups for this run (blank = CITATION_MAX_LOOKUPS variable, else 100)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: publication-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update database and CSV backup
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          CITATION_MAX_LOOKUPS: ${{ inputs.citation_max_lookups || vars.CITATION_MAX_LOOKUPS }}
          CITATION_TIME_LIMIT_MINUTES: ${{ vars.CITATION_TIME_LIMIT_MINUTES }}
        run: |
          if [ "${{ inputs.seed_database }}" = "true" ]; then
            python scripts/sync_database.py --csv publications.csv --seed
          elif [ "${{ inputs.skip_citations }}" = "true" ]; then
            python scripts/sync_database.py --csv publications.csv --no-citations
          else
            python scripts/sync_database.py --csv publications.csv
          fi

      - name: Commit updated CSV
        run: |
          if git diff --quiet -- publications.csv; then
            echo "No publication changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.csv
          git commit -m "Update publications from PubMed ($(date -u +%F))"
          git push
