name: Update publications from PubMed

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update publications
        run: python scripts/update_publications.py

      - name: Commit changes
        run: |
          if git diff --quiet -- publications.csv; then
            echo "No publication changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.csv
          git commit -m "Update publications from PubMed"
          git push  
